<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — Перевёрнутый класс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">
            <img src="logo.jpg" alt="Логотип Перевёрнутого класса" class="site-logo">
            <span>Перевёрнутый класс</span>
        </div>

        <nav>
            <a href="index.html">Главная</a>
            <a href="theory.html">Теория</a>
            <a href="practice.html">Практика</a>
            <a href="calendar.html">Календарь</a>
            <a href="community.html">Сообщество</a>
            <a href="feedback.html">Обратная связь</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Обратная связь</h1>
    <p>Мы будем рады узнать ваше мнение о проекте «Перевёрнутый класс».</p>

    <section class="card">
        <h2>Оставьте отзыв</h2>

        <form>
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" placeholder="Введите имя">

            <label for="email">Электронная почта:</label>
            <input type="email" id="email" placeholder="Введите почту">

            <label for="message">Ваше сообщение:</label>
            <textarea id="message" rows="5" placeholder="Напишите отзыв или предложение"></textarea>

            <button type="button">Отправить</button>
        </form>
    </section>
</main>

</body>
</html>
