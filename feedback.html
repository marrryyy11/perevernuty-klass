<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — Перевёрнутый класс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="logo.jpg" alt="Логотип" class="site-logo">
        <span>Перевёрнутый класс</span>
    </div>

    <nav>
        <a href="index.html">Главная</a>
        <a href="theory.html">Теория</a>
        <a href="practice.html">Практика</a>
        <a href="calendar.html">Календарь</a>
        <a href="community.html">Сообщество</a>
        <a href="feedback.html">Обратная связь</a>
    </nav>

    <input type="search" placeholder="Поиск...">
</header>

<main>
    <section class="hero">
        <h1>Обратная связь</h1>
        <p>
            Нам важно ваше мнение! Поделитесь впечатлениями
            о сайте, задайте вопрос или предложите идею
            для его улучшения.
        </p>
    </section>

    <section class="content-card">
        <h2>Напишите нам</h2>

        <form>
            <p>
                <label for="name">Ваше имя:</label>

                <input type="text" id="name"
                       placeholder="Введите ваше имя" required>
            </p>

            <p>
                <label for="email">Электронная почта:</label>

                <input type="email" id="email"
                       placeholder="Введите email" required>
            </p>

            <p>
                <label for="topic">Тема обращения:</label>

                <select id="topic">
                    <option>Вопрос</option>
                    <option>Предложение</option>
                    <option>Отзыв</option>
                    <option>Проблема на сайте</option>
                </select>
            </p>

            <p>
                <label for="message">Ваше сообщение:</label>

                <textarea id="message" rows="6"
                          placeholder="Напишите сообщение..."
                          required></textarea>
            </p>

            <button type="button" class="button"
                    onclick="alert('Спасибо за ваш отзыв! Форма пока демонстрационная.')">
                Отправить
            </button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Перевёрнутый класс</p>
    <p>Спасибо, что помогаете нам становиться лучше!</p>
</footer>

</body>
</html>
